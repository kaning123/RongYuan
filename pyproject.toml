[project]
name = "rongyuan"
version = "0.1.1"
description = "A simple PYPI source merger."
readme = "README.md"
authors = [
    { name = "Kaning123", email = "kaning123official@163.com" }
]
requires-python = ">=3.13.9"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.34.2",
    "waitress>=3.0.2",
]

[project.scripts]
rongyuan = "rongyuan:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
